plugins {
	id "com.crystaelix.loom" version "1.17-SNAPSHOT"
	id "eclipse"
	id "idea"
	id "maven-publish"
	id "com.crystaelix.blossom" version "1.3.2"
	id "me.modmuss50.mod-publish-plugin" version "2.2.0"
}

repositories {
	mavenCentral()
	flatDir {
		dirs "libs"
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.crystaelix.com/releases/"
			}
		}
		filter {
			includeGroup "thelm.packagedauto"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.blamejared.com/"
			}
		}
		filter {
			includeGroup "mezz.jei"
			includeGroup "vazkii.patchouli"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.amadornes.com/"
			}
		}
		filter {
			includeGroup "MCMultiPart2"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.zeith.org/"
			}
		}
		filter {
			includeGroup "org.zeith.HammerLib"
			includeGroup "org.zeith.ThaumicAdditions"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://repo.cleanroommc.com/releases/"
			}
		}
		filter {
			includeGroup "zone.rong"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://cursemaven.com/"
			}
		}
		filter {
			includeGroup "curse.maven"
		}
	}
}

def mcVersion = "1.12.2"
def modName = "PackagedThaumic"
def modId = "packagedthaumic"
def specVersion = "1"
def vendor = "thelm"

group = "thelm.packagedthaumic"
version = "1.0.3.20"

def archivesName = "${modName}-${mcVersion}"
base.archivesName = archivesName

sourceSets {
	configureEach {
		output.resourcesDir = java.destinationDirectory = layout.buildDirectory.dir("outputs/${name}")
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(8)
		vendor = JvmVendorSpec.AZUL
	}
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
}

loom {
	silentMojangMappingsLicense()
	runs {
		configureEach {
			property "fabric.log.console.level", "debug"
		}
		client {
			programArg "--username=Dev"
		}
		server
	}
	generatedIntermediateMappings()
}

dependencies {
	// Minecraft
	minecraft "com.mojang:minecraft:1.12.2"
	mappings "de.oceanlabs.mcp:mcp_stable:39-1.12"
	legacyForge "net.minecraftforge:forge:1.12.2-14.23.5.2864"

	// Dependencies
	modImplementation "thelm.packagedauto:PackagedAuto-1.12.2:1.0.24.73"
	modImplementation "curse.maven:baubles-227083:2518667"
	modImplementation "curse.maven:thaumcraft-223628:2629023"
	modImplementation "mezz.jei:jei_1.12.2:4.16.1.1013"
	modImplementation "curse.maven:thaumic-jei-285492:5646810"
	modImplementation "curse.maven:applied-energistics-2-223794:2747063"
	modImplementation "curse.maven:thaumic-energistics-extended-life-849094:4513158"
	modImplementation "vazkii.patchouli:Patchouli:1.0-23.6"

	// Testing
	modImplementation "org.zeith.HammerLib:HammerLib-1.12.2:12.2.66"
	modImplementation "org.zeith.ThaumicAdditions:ThaumicAdditions-1.12.2:12.7.9"
	modImplementation "curse.maven:mcmultipart-239431:2615930"
	modImplementation "curse.maven:mekanism-268560:2835175"

	// Performance
	implementation("zone.rong:mixinbooter:10.7") {transitive = false}
	modImplementation "curse.maven:reid-629017:8029704"
	modImplementation "curse.maven:vintagefix-871198:7958801"
	modImplementation "curse.maven:chibi-460609:8225778"
}

def replacements = [
	"0@VERSION@": version
]

blossom {
	replaceToken(replacements)
}

processResources {
	inputs.properties(replacements)
	filesMatching(["mcmod.info", "META-INF/mods.toml", "META-INF/neoforge.mods.toml", "fabric.mod.json"]) {
		filter {
			it.replace(replacements)
		}
	}
}

def manifestAttributes = [
	"Specification-Title": modName,
	"Specification-Vendor": vendor,
	"Specification-Version": specVersion,
	"Implementation-Title": archivesName,
	"Implementation-Version": version,
	"Implementation-Vendor": vendor
]

jar {
	manifest.attributes(manifestAttributes)
}

sourcesJar {
	manifest.attributes(manifestAttributes)
}

publishing {
	publications {
		register("mavenJava", MavenPublication) {
			artifactId = archivesName
			artifact remapJar
			artifact sourcesJar
		}
	}
	repositories {
		if(project.hasProperty("CrystaelixMavenUsername") && project.hasProperty("CrystaelixMavenPassword")) {
			maven {
				name = "CrystaelixMaven"
				url = "https://maven.crystaelix.com/releases/"
				credentials(PasswordCredentials)
			}
		}
	}
}

publishMods {
	file = remapJar.archiveFile
	version = displayName = "${mcVersion}-${project.version}"
	changelog = file("changelog.md").text
	type = BETA
	modLoaders.add("forge")
	additionalFiles.from(sourcesJar.archiveFile)

	curseforge {
		accessToken = providers.gradleProperty("curseforge.token")
		projectId = "908613"
		minecraftVersions.add(mcVersion)
		client = true
		server = true
		requires "packagedauto", "thaumcraft"
		optional "applied-energistics-2", "thaumic-energistics"
	}

	modrinth {
		accessToken = providers.gradleProperty("modrinth.token")
		projectId = "qjnayfYX"
		minecraftVersions.add(mcVersion)
		environment = CLIENT_AND_SERVER
		requires "packagedauto"
		optional "ae2"
	}
}
